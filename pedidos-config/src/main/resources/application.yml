# =============================================================================
# Servidor de configuracion (Spring Cloud Config)
# =============================================================================
server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: pedidos-config
  main:
    banner-mode: "off"
  # Backend "native": la configuracion se sirve desde un directorio (config-repo/).
  # Sin este perfil Spring Cloud Config usa el backend git y no arranca sin URI.
  profiles:
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        # Descifra en el servidor los valores "{cipher}..." antes de servirlos.
        encrypt:
          enabled: true
        # Backend git (Gitea): solo se usa con el perfil "git".
        git:
          uri: ${CONFIG_GIT_URI:}
          username: ${CONFIG_GIT_USUARIO:}
          password: ${CONFIG_GIT_PASSWORD:}
          default-label: ${CONFIG_GIT_RAMA:main}

# El backend "native" (directorio montado) SOLO se activa con su perfil: si se
# declara search-locations sin perfil, Spring Cloud Config usa ese repositorio
# siempre y el backend git no llega a activarse.
---
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo}

# Clave simetrica de cifrado JCE. Vive en el ENTORNO, nunca en el repositorio.
# Sin clave, los endpoints /encrypt y /decrypt no estan disponibles.
encrypt:
  key: ${CONFIG_ENCRYPT_KEY:}

# /encrypt y /decrypt son endpoints propios del Config Server (no de Actuator).
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
