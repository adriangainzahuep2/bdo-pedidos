# =============================================================================
# Stack completo de la prueba tecnica (microservicios + PostgreSQL).
#
#   docker compose up --build
#
# Los secretos NO estan en este fichero: se inyectan por variable de entorno
# (ver .env.example). Ningun valor sensible tiene valor por defecto: si falta,
# el servicio que lo necesita no arranca.
# =============================================================================

name: bdo-pedidos

x-common: &common
  restart: unless-stopped
  networks: [bdo]
  environment: &common-env
    SPRING_PROFILES_ACTIVE: eureka
    EUREKA_URL: http://pedidos-registry:8761/eureka/
    AUTH_ISSUER: http://pedidos-auth:9000
    AUTH_ISSUER_URI: http://pedidos-auth:9000
    AUTH_JWKS_URI: http://pedidos-auth:9000/oauth2/jwks
    # Trazas distribuidas: cada servicio instrumentado envia sus spans a Zipkin.
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans

services:

  # --- Infraestructura ------------------------------------------------------
  pedidos-registry:
    build:
      context: .
      args:
        MODULO: pedidos-registry
    image: bdo/pedidos-registry:1.0.0
    <<: *common
    environment:
      <<: *common-env
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8761 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  pedidos-config:
    build:
      context: .
      args:
        MODULO: pedidos-config
    image: bdo/pedidos-config:1.0.0
    <<: *common
    environment:
      <<: *common-env
      SERVER_PORT: 8888
      # Backend "native" (directorio montado) por defecto. Con CONFIG_PROFILE=git
      # el Config Server lee la configuracion de un repositorio Git (Gitea) y
      # descifra los secretos con JCE ({cipher}).
      SPRING_PROFILES_ACTIVE: ${CONFIG_PROFILE:-native}
      CONFIG_REPO_LOCATION: file:///config-repo
      # Clave simetrica de cifrado JCE. En un entorno real sale de un
      # KMS/Vault, no de un fichero de variables.
      CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY:-}
      # Backend git: solo se usan con CONFIG_PROFILE=git.
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_GIT_URI:-}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_GIT_USUARIO:-}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_GIT_PASSWORD:-}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_GIT_RAMA:-main}
    volumes:
      - ./config-repo:/config-repo:ro
    # Permite alcanzar al Gitea del stack de CI desde el contenedor.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8888"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [bdo]
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedidos}
      POSTGRES_DB: pedidos
    volumes:
      - postgres-pedidos:/var/lib/postgresql/data
      # Cada microservicio tiene su propia base de datos. El script de inicializacion
      # (solo se ejecuta con el volumen vacio) aplica el DDL de pedidos en "pedidos",
      # crea la base "clientes" y aplica alli el DDL de clientes. El DDL es el mismo
      # que se usa con H2 en modo PostgreSQL.
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./pedidos-api/src/main/resources/db/schema.sql:/esquemas/pedidos.sql:ro
      - ./pedidos-cliente/src/main/resources/db/schema.sql:/esquemas/clientes.sql:ro
    ports:
      # Puerto 55432 en la maquina: no choca con un PostgreSQL local en 5432.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Seguridad ------------------------------------------------------------
  pedidos-auth:
    build:
      context: .
      args:
        MODULO: pedidos-auth
    image: bdo/pedidos-auth:1.0.0
    <<: *common
    environment:
      <<: *common-env
      SERVER_PORT: 9000
      AUTH_CLIENT_SECRET_GATEWAY: ${AUTH_CLIENT_SECRET_GATEWAY:-}
      AUTH_USUARIO_PASSWORD: ${AUTH_USUARIO_PASSWORD:-}
      AUTH_UI_REDIRECT_URI: ${AUTH_UI_REDIRECT_URI:-http://localhost:8080/index.html}
    depends_on:
      pedidos-registry:
        condition: service_healthy
    ports:
      - "9000:9000"

  # --- Servicios de negocio --------------------------------------------------
  pedidos-cliente:
    build:
      context: .
      args:
        MODULO: pedidos-cliente
    image: bdo/pedidos-cliente:1.0.0
    <<: *common
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      # "eventos": consume PedidoConfirmado de RabbitMQ (proyeccion de pedidos por cliente).
      SPRING_PROFILES_ACTIVE: eureka,postgres,eventos
      RABBITMQ_HOST: rabbitmq
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/clientes
      SPRING_R2DBC_USERNAME: pedidos
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-pedidos}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8080"

  pedidos-api:
    build:
      context: .
      args:
        MODULO: pedidos-api
    image: bdo/pedidos-api:1.0.0
    <<: *common
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      # "eventos": publica PedidoConfirmado en RabbitMQ al confirmar un pedido.
      SPRING_PROFILES_ACTIVE: eureka,postgres,eventos
      RABBITMQ_HOST: rabbitmq
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/pedidos
      SPRING_R2DBC_USERNAME: pedidos
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-pedidos}
      # Token del proveedor logistico: llega por el ENTORNO, nunca en el codigo.
      PROVEEDOR_LOGISTICO_TOKEN: ${PROVEEDOR_LOGISTICO_TOKEN:-}
      PROVEEDOR_LOGISTICO_URL: http://proveedor-logistico:8090/api/tarifas
    depends_on:
      postgres:
        condition: service_healthy
      proveedor-logistico:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8080"

  pedidos-gateway:
    build:
      context: .
      args:
        MODULO: pedidos-gateway
    image: bdo/pedidos-gateway:1.0.0
    <<: *common
    environment:
      <<: *common-env
      SERVER_PORT: 8080
    depends_on:
      pedidos-registry:
        condition: service_healthy
    ports:
      - "8080:8080"

  # --- Mensajeria -----------------------------------------------------------
  # RabbitMQ: broker de los eventos asincronos (PedidoConfirmado). Consola de gestion
  # en http://localhost:15672/ (guest/guest, solo desde localhost): exchanges, colas,
  # mensajes pendientes y la cola de mensajes muertos.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    networks: [bdo]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Observabilidad -------------------------------------------------------
  # Zipkin recibe los spans de gateway, auth, pedidos y clientes y reconstruye cada
  # peticion de extremo a extremo (UI en http://localhost:9411/). Almacenamiento en
  # memoria: suficiente para una demo; en produccion, Elasticsearch o Cassandra.
  zipkin:
    image: openzipkin/zipkin:3.4.2
    restart: unless-stopped
    networks: [bdo]
    ports:
      - "9411:9411"

  # Prometheus recoge /actuator/prometheus de cada servicio cada 15 s
  # (UI y consultas PromQL en http://localhost:9090/).
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    networks: [bdo]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # --- Proveedor logistico simulado (sustituye al proveedor real) ------------
  proveedor-logistico:
    image: python:3.12-alpine
    restart: unless-stopped
    networks: [bdo]
    working_dir: /app
    volumes:
      - ./scripts/mock-proveedor.py:/app/mock-proveedor.py:ro
    environment:
      PROVEEDOR_LOGISTICO_TOKEN: ${PROVEEDOR_LOGISTICO_TOKEN:-}
    # El simulador exige el mismo token que envia el servicio de pedidos.
    command: ["sh", "-c", "exec python3 /app/mock-proveedor.py --puerto 8090 --token \"$$PROVEEDOR_LOGISTICO_TOKEN\""]
    ports:
      - "8090:8090"

networks:
  bdo:
    driver: bridge

volumes:
  postgres-pedidos:
