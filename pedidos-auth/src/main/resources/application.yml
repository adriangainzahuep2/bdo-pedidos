# =============================================================================
# Servidor de autorizacion OAuth2 (Spring Authorization Server)
#
# Los secretos NO estan en el codigo fuente: llegan por variable de entorno
# (o por Spring Cloud Config cifrado). Si faltan, la aplicacion falla al arrancar.
# =============================================================================
server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful

spring:
  application:
    name: pedidos-auth
  main:
    banner-mode: "off"

auth:
  issuer: ${AUTH_ISSUER:http://localhost:9000}
  access-token-minutos: 60
  audiencias:
    - pedidos-api
    - pedidos-cliente
    - pedidos-gateway

  # Origenes de la consola web autorizados a canjear el codigo por el token (CORS).
  origenes-cors: ${AUTH_ORIGENES_CORS:http://localhost:8080}

  # Usuario de la consola web (flujo authorization_code + PKCE).
  usuario: ${AUTH_USUARIO:demo}
  password: ${AUTH_USUARIO_PASSWORD:}

  clientes:
    # Cliente de servicio: lo usan el gateway y los scripts (client_credentials).
    - client-id: ${AUTH_CLIENT_ID_GATEWAY:pedidos-gateway}
      client-secret: ${AUTH_CLIENT_SECRET_GATEWAY:}
      scopes:
        - pedidos.read
        - pedidos.write
        - clientes.read
        - clientes.write
      grant-types:
        - client_credentials

    # Cliente de la consola web: publico, con PKCE (nunca guarda secretos).
    - client-id: ${AUTH_CLIENT_ID_UI:consola-web}
      client-secret: ""
      publico: true
      scopes:
        - pedidos.read
        - pedidos.write
        - clientes.read
        - clientes.write
      grant-types:
        - authorization_code
        - refresh_token
      # La consola es una sola pagina: la vuelta del servidor llega a index.html.
      redirect-uri: ${AUTH_UI_REDIRECT_URI:http://localhost:8080/index.html}

management:
  # --- Observabilidad -------------------------------------------------------
  # Trazas distribuidas: Micrometer Tracing (Brave) crea un span por peticion y por
  # llamada saliente, propaga el contexto en cabeceras W3C (traceparent) y exporta los
  # spans a Zipkin. El X-Correlation-Id viaja como "baggage" y entra en el MDC del log.
  tracing:
    sampling:
      probability: ${TRACING_PROBABILIDAD:1.0}
    baggage:
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  # Metricas: etiqueta comun para distinguir servicios en Prometheus, e histograma de
  # latencias HTTP (permite calcular p95/p99 con histogram_quantile).
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  # traceId, spanId y X-Correlation-Id en cada linea (Boot lo anade con %correlationId).
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{X-Correlation-Id:-}] "
  level:
    root: INFO
    org.springframework.security: INFO
