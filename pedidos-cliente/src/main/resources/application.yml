# Servicio de clientes - configuracion por defecto (entorno local / tests)
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  # Propaga el contexto de traza (y el MDC) a traves de los operadores de Reactor.
  reactor:
    context-propagation: auto
  application:
    name: pedidos-cliente
  main:
    banner-mode: "off"
  r2dbc:
    url: "r2dbc:h2:mem:///clientes?options=DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    username: sa
    password: ""
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      platform: h2
      encoding: UTF-8
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/oauth2/jwks}
  cloud:
    discovery:
      enabled: false

management:
  # --- Observabilidad -------------------------------------------------------
  # Trazas distribuidas: Micrometer Tracing (Brave) crea un span por peticion y por
  # llamada saliente, propaga el contexto en cabeceras W3C (traceparent) y exporta los
  # spans a Zipkin. El X-Correlation-Id viaja como "baggage" y entra en el MDC del log.
  tracing:
    sampling:
      probability: ${TRACING_PROBABILIDAD:1.0}
    baggage:
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  # Metricas: etiqueta comun para distinguir servicios en Prometheus, e histograma de
  # latencias HTTP (permite calcular p95/p99 con histogram_quantile).
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  # traceId, spanId y X-Correlation-Id en cada linea (Boot lo anade con %correlationId).
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{X-Correlation-Id:-}] "
  level:
    root: INFO
    com.bdo.pedidos: INFO

---
# Perfil postgres: base de datos de produccion
spring:
  config:
    activate:
      on-profile: postgres
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/clientes}
    username: ${SPRING_R2DBC_USERNAME:clientes}
    password: ${SPRING_R2DBC_PASSWORD:clientes}
  sql:
    init:
      mode: never
      platform: postgresql

---
# Perfil eureka: registro en el servidor de descubrimiento
spring:
  config:
    activate:
      on-profile: eureka
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
