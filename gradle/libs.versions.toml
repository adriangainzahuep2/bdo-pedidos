# =============================================================================
# Catalogo de versiones (Gradle version catalog).
#
# Fuente unica de verdad de las versiones: sustituye al <dependencyManagement>
# del POM padre. Cada modulo consume las que necesita a traves de `libs`.
# =============================================================================

[versions]
java = "17"
springBoot = "3.3.5"
springCloud = "2023.0.3"
resilience4j = "2.2.0"
reactor = "2023.0.11"
wiremock = "3.9.2"
sonarqube = "6.0.1.5171"

[libraries]
# --- Plataformas (BOM) -------------------------------------------------------
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
resilience4j-bom = { module = "io.github.resilience4j:resilience4j-bom", version.ref = "resilience4j" }
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor" }

# --- Framework ---------------------------------------------------------------
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
# Desde Spring Boot 3.1 el BOM gestiona el starter del servidor de autorizacion
# (Spring Authorization Server 1.3.x con Boot 3.3): no lleva version propia.
spring-boot-starter-oauth2-authorization-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-authorization-server" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# --- Spring Cloud (Netflix OSS) ---------------------------------------------
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
spring-cloud-starter-netflix-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-netflix-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }

# --- Resiliencia -------------------------------------------------------------
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor" }
# Filtro CircuitBreaker de Spring Cloud Gateway (Spring Cloud CircuitBreaker sobre Resilience4j).
spring-cloud-starter-circuitbreaker-reactor-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }

# --- Observabilidad (versiones del BOM de Spring Boot) -----------------------
# Trazas: Micrometer Tracing con Brave, exportadas a Zipkin.
micrometer-tracing-bridge-brave = { module = "io.micrometer:micrometer-tracing-bridge-brave" }
zipkin-reporter-brave = { module = "io.zipkin.reporter2:zipkin-reporter-brave" }
# Metricas en formato Prometheus (/actuator/prometheus).
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# Metricas de los circuitos, reintentos y limitadores de Resilience4j.
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer" }

# --- Seguridad ---------------------------------------------------------------
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# --- Reactividad y persistencia ---------------------------------------------
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-test = { module = "io.projectreactor:reactor-test" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool" }
r2dbc-h2 = { module = "io.r2dbc:r2dbc-h2" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }

# --- Test --------------------------------------------------------------------
# El dominio no usa el BOM de Spring Boot (para no arrastrar Spring ni en las
# dependencias de test): declara sus propias versiones, que son las mismas que
# gestiona el BOM de Spring Boot 3.3.5.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "5.10.5" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.25.3" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
