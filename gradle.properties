# =============================================================================
# Propiedades del build Gradle.
# =============================================================================

# Memoria del daemon de Gradle (compila Kotlin DSL + compila el proyecto).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Modulos en paralelo: el reactor de 8 modulos se construye mucho antes.
org.gradle.parallel=true

# Cache de compilacion: la segunda build es casi instantanea si no cambia nada.
org.gradle.caching=true

# El daemon se reutiliza entre invocaciones.
org.gradle.daemon=true

# Traza de ejecuciones: util para depurar el orden de tareas.
org.gradle.logging.level=lifecycle
