# Configuracion especifica de los tests.
#
# - No se carga el juego de datos de demostracion: la base H2 en memoria se
#   comparte entre todos los contextos de test de la JVM y los datos semilla
#   duplicarian los pedidos.
# - El proveedor logistico se sustituye por un stub WireMock cuya URL se
#   inyecta dinamicamente (ver ProveedorLogisticoStub).
spring:
  # Igual que en main (este fichero sustituye entero al de main en los tests).
  reactor:
    context-propagation: auto
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/sin-datos.sql
      platform: h2
      encoding: UTF-8

  r2dbc:
    url: "r2dbc:h2:mem:///pedidos-test?options=DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    username: sa
    password: ""

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
          jwk-set-uri: http://localhost:9000/oauth2/jwks

  cloud:
    discovery:
      enabled: false

app:
  proveedor:
    url: http://localhost:1/api/tarifas
    token: token-de-prueba
    modo: reactivo
    connect-timeout: 2s
    # Presupuestos holgados a proposito: cuando el build compila los ocho modulos en
    # paralelo, la JVM de test compite por la CPU y una llamada a un servidor local puede
    # tardar bastante mas de lo normal. Un timeout corto hacia fallar el test por
    # saturacion de la maquina y no por un defecto del codigo. El escenario que comprueba
    # el timeout usa su propio presupuesto (ver PedidoControllerTimeoutTest).
    timeout-por-intento: 5s
    timeout-global: 20s
    max-intentos: 3
    backoff-inicial: 50ms
    backoff-multiplicador: 2.0
    backoff-jitter: 0.2

  clientes:
    url: http://localhost:1
    load-balanced: false
    timeout: 1s

  recuperacion:
    confirmaciones:
      lease-ms: 120000
      intervalo-ms: 3600000

resilience4j:
  circuitbreaker:
    instances:
      proveedorLogistico:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # Que cuenta como fallo lo decide el codigo: 5xx, 429, timeouts, errores de
        # conexion y respuestas invalidas. Un 4xx no abre el circuito (el error es
        # nuestro, el proveedor esta sano).
        record-failure-predicate: com.bdo.pedidos.api.proveedor.ClasificadorFallosProveedor$CuentaParaElCircuito
  ratelimiter:
    instances:
      proveedorLogistico:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0
  bulkhead:
    instances:
      proveedorLogistico:
        max-concurrent-calls: 32
        max-wait-duration: 0
  # Los reintentos NO se configuran aqui: se derivan de app.proveedor.* (max-intentos,
  # backoff-*) para que los adaptadores reactivo y bloqueante usen la misma politica.

# Observabilidad: la misma configuracion que en main. Las trazas y la exportacion de
# metricas solo se activan en las suites con @AutoConfigureObservability.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id
  metrics:
    tags:
      application: pedidos-api
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    correlation: "[pedidos-api,%X{traceId:-},%X{spanId:-},%X{X-Correlation-Id:-}] "
  level:
    root: WARN
    com.bdo.pedidos: INFO
    org.springframework: WARN
    org.springframework.r2dbc: WARN
