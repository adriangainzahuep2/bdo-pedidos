# =============================================================================
# API Gateway
# =============================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  # Propaga el contexto de traza (y el MDC) a traves de los operadores de Reactor.
  reactor:
    context-propagation: auto
  application:
    name: pedidos-gateway
  main:
    banner-mode: "off"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/oauth2/jwks}

  cloud:
    discovery:
      enabled: false
    gateway:
      # Enrutado explicito: el gateway es el unico que conoce el mapa de la arquitectura.
      routes:
        - id: pedidos-api
          uri: lb://pedidos-api
          predicates:
            - Path=/api/pedidos/**
          filters:
            - StripPrefix=0
            # Un circuito por microservicio de destino: si pedidos-api cae, las rutas de
            # clientes siguen abiertas. El fallback distingue 503 (caido) de 504 (lento).
            - name: CircuitBreaker
              args:
                name: pedidosApi
                fallbackUri: forward:/fallback/pedidos-api
        - id: cliente-api
          uri: lb://pedidos-cliente
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: clientesApi
                fallbackUri: forward:/fallback/pedidos-cliente
        # Consola web (HTML, CSS y JavaScript): la sirve el servicio de pedidos y se publica
        # a traves del gateway para que la pagina y la API compartan origen.
        - id: consola-web
          uri: lb://pedidos-api
          predicates:
            - Method=GET
            - Path=/,/index.html,/app.js,/pkce.js,/styles.css,/favicon.ico
          filters:
            # La consola la sirve pedidos-api: comparte su circuito.
            - name: CircuitBreaker
              args:
                name: pedidosApi
                fallbackUri: forward:/fallback/pedidos-api
      # Tiempo maximo de respuesta del microservicio: por encima del presupuesto global
      # de la confirmacion (8 s) para que sea el servicio de pedidos quien responda 504.
      httpclient:
        connect-timeout: 2000
        response-timeout: 15s
      # Las rutas son SOLO las declaradas arriba. El "discovery locator" crearia una ruta
      # automatica por cada servicio registrado (/pedidos-auth/**, /pedidos-api/actuator/**...)
      # y expondria servicios internos a traves del gateway.
      discovery:
        locator:
          enabled: false

resilience4j:
  # Circuitos de las rutas (filtro CircuitBreaker). Cuentan como fallo las EXCEPCIONES
  # hacia el microservicio (conexion rechazada, sin instancias en Eureka, timeout de
  # respuesta), NO sus respuestas 5xx: un 502/503/504 de pedidos-api es su forma correcta
  # de informar de que el PROVEEDOR falla, y el microservicio esta sano.
  circuitbreaker:
    configs:
      microservicio:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # Una confirmacion legitima tarda hasta 8 s (presupuesto del proveedor).
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      pedidosApi:
        base-config: microservicio
      clientesApi:
        base-config: microservicio
  # El TimeLimiter de Spring Cloud CircuitBreaker corta a 1 s por defecto: cortaria las
  # confirmaciones (hasta 8 s). Se deja por encima del response-timeout (15 s), para que
  # el limite efectivo sea el del cliente HTTP del gateway.
  timelimiter:
    configs:
      microservicio:
        timeout-duration: 16s
        cancel-running-future: true
    instances:
      pedidosApi:
        base-config: microservicio
      clientesApi:
        base-config: microservicio
  ratelimiter:
    instances:
      apiGateway:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0

management:
  # --- Observabilidad -------------------------------------------------------
  # Trazas distribuidas: Micrometer Tracing (Brave) crea un span por peticion y por
  # llamada saliente, propaga el contexto en cabeceras W3C (traceparent) y exporta los
  # spans a Zipkin. El X-Correlation-Id viaja como "baggage" y entra en el MDC del log.
  tracing:
    sampling:
      probability: ${TRACING_PROBABILIDAD:1.0}
    baggage:
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  # Metricas: etiqueta comun para distinguir servicios en Prometheus, e histograma de
  # latencias HTTP (permite calcular p95/p99 con histogram_quantile).
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  # traceId, spanId y X-Correlation-Id en cada linea (Boot lo anade con %correlationId).
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{X-Correlation-Id:-}] "
  level:
    root: INFO
    com.bdo.pedidos: INFO

---
# Perfil eureka: registro en el servidor de descubrimiento
spring:
  config:
    activate:
      on-profile: eureka
  cloud:
    discovery:
      enabled: true
    # La cache de instancias de Spring Cloud LoadBalancer dura 35 s por defecto: un servicio
    # que se registra justo despues de una consulta seria invisible durante ese tiempo
    # (y se responderia 503). Se alinea con el refresco del registro de Eureka.
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Refresco frecuente del registro: el gateway debe conocer al instante las
    # instancias que se dan de alta o de baja.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
